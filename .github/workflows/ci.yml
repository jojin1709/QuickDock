name: QuickDock CI Build & Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Build & Run Automated Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore QuickDock.slnx

      - name: Build Solution
        run: dotnet build QuickDock.slnx -c Release --no-restore

      - name: Run Unit & Security Test Suite
        run: dotnet test tests/QuickDock.Core.Tests/QuickDock.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
